services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aim-academy-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:/data/dev.db
      - LOGIN_WINDOW_MS=900000
      - MAX_LOGIN_ATTEMPTS=5
      # CORS_ORIGIN is set to * to ensure connectivity across all IPs/Domains by default.
      # For strict security, replace with your specific domain.
      - CORS_ORIGIN=*
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s # Increased for intensive seeding

  aim-academy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aim-academy-frontend
    restart: always
    ports:
      - "9010:80"
    depends_on:
      backend:
        condition: service_healthy
